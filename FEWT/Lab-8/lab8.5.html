<!-- 5. WAP to demonstrate change in properties of HTML element using JavaScript. (A) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab8.5</title>
</head>
<body>
    <button id="changetext" onclick="Change_Properties()">Click</button>
    <h1 id="text">Hello World</h1>
    <script>
        function Change_Properties(){
            document.getElementById("text").innerHTML = "<i>Text Changed</i>"
            document.getElementById("text").style.fontSize = "50px"
            document.getElementById("text").style.color = "lightblue"
        }
    </script> 
</body>
</html>
