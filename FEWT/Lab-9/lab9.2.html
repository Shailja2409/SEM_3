<!-- 2. Demonstrate the difference between let and var. (A) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab9.2</title>
</head>
<body>
    <script>
        i=0;
        if(i==0){
            let a = 10;
            var b = 20;

            document.write("Let variable: " + (a+b) + "<br/>");
        }
        document.write("Var variable: " + b);
    </script>
    
</body>
</html>
