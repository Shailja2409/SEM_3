<!-- 3. Demonstrate the default parameter while using a function. (A) -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab9.3</title>
 </head>
 <body>
    <script>
        function defaultDemo(a,b,c=5){
            sum = a + b + c;
            document.write("Sum is: " +sum + "<br/>");
        }

        defaultDemo(10,50,1);
        defaultDemo(5,3);
    </script>
 </body>
 </html>
