<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab1.2</title>
    <style>
        .linkbox{
            background-color: white;
            margin-top: 100px;
        }

        #a{
            color: red;
        }

        a:visited{
            color: orange;
        }

        .para1::first-line{
            color: palevioletred;
            font-size: 30px;
        }
        .para1::first-letter{
            color: black;
            font-size: 40px;
        }
        .para1::selection{
            color: aquamarine;
        }

        .btn:hover{
            background-color: blue;
        }

    </style>
</head>
<body>
    <div class="linkbox"><a href="https://getbootstrap.com/" id = "link">
        CLICK HERE</a>
    </div>

    <p class="para1">Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Error veritatis quidem impedit ab iusto labore blanditiis, 
        dolorem enim ipsa velit omnis recusandae voluptatem amet ullam harum provident nesciunt at facere.
    </p>

    <button class="btn">Click btn</button>
    
</body>
</html>
