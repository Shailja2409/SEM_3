<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab3.6(Armstrong number)</title>
</head>
<body>
    <!-- 6. WAP in JavaScript to check whether the given number is Armstrong or not. (A) -->
    <script>
        let n = parseInt(prompt("Enter number:"));

        let temp=n,sum=0,digit;

        while(n != 0){
            digit = n % 10;
            sum = sum + (digit*digit*digit);
            n = parseInt(n/10);
        }

        if(temp == sum){
            document.write(temp + "is an Armstrong number");
        }
        else{
            document.write(temp + " is not Armstrong number");
        }

    </script>
    
</body>
</html>
