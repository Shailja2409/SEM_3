<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab3.2 (PRIME NUMBER)</title>
</head>
<body>
    <!-- 2. WAP in JavaScript to check whether the given no. is prime or not. (A) -->
    <script>
        n = parseInt(prompt("Enter a number:"));

        isPrime = true // Assumed that it is true

        if(n <= 1){
            isPrime = false; // cause Never Prime 
        }
        else{
            for(i=2; i<=n/2; i++){
                if(n%2==0){
                    isPrime = false; // Divisible that is why condition false
                    break;
                }
            }
        }

        if(isPrime){ // isPrime remains true than It is a PRIME NUMBER 
            document.write(n+ "is a prime number");
        }
        else{ // Rather NOT a PRIME NUMBER
            document.write(n+ "is not a prime number");
        }

    </script>
</body>
</html>
