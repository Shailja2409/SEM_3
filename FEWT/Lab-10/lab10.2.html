<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.2</title>
</head>
<body>
    <!-- 2. Write JavaScript that handles following mouse event. (B)
• If mouse left button pressed on browser, it displayed message “Left Clicked”.
• If mouse right button pressed on browser, it displayed message “Right Clicked”. -->

    <h2>
        <p id="para">Clicked Here</p>
    </h2>

    <script>
        document.addEventListener("mousedown",function(event){
            if(event.button == 0){
                document.getElementById("para").innerHTML = "Left Click";
            }
            if(event.button == 2){
                document.getElementById("para").innerHTML = "Right Click";
            }
        });

        document.addEventListener("contextmenu", function(event){
            event.preventDefault();
        })
    </script>
    
</body>
</html>
