<body>
    <!-- 3. WAP to display students stored in array. (A) -->
    <script>
        studentList = [{name : 'AYUSHI', image : 'amazon.png'}, 
                       {name : 'YASHVI', image : 'google.png'},
                       {name : 'DEEP', image : 'lenovo.png'}];

        for(i=0;i<studentList.length;i++){
            document.write("Faculty List: "+studentList[i].name + "<br/>");
            document.write("<img src =\"" + studentList[i].image + "\"/>" + "<br/>");
        }
    </script>
    
</body>
