<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab5.5</title>
</head>
<body>
    <!-- 5. Write a JavaScript that uses a loop that searches a word in sentence held in an array, returning the
    index of the word. (B) -->
    <script>
        arr = ['flower','glow','magic']

        word = prompt("Enter a word to search:");

        let index = -1

        for(i=0;i<arr.length;i++){
            if(arr[i] == word){
                index = i;
                break;
            }
        }

        document.write("Word index is: "+index);
    </script>
</body>
</html>
