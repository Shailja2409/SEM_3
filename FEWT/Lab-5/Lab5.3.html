<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab5.3</title>
</head>
<body>
    <!-- 3. WAP to read an array from the user and sort them using bubble sort. (A) -->
    <script>
        n = parseInt(prompt("Enter a number:"));
        let temp;

        arr = [];

        for(i=0;i<n;i++){
            arr[i] = parseInt(prompt("Enter array elements:"));
        }

        for(i=0;i<n;i++){
            document.write(arr[i] + "<br/>");
        }


        for(i=0;i<n-1;i++){
            for(j=0;j<n-i-1;j++){
                if(arr[j]>arr[j+1]){
                    temp = arr[j];
                    arr[j] = arr[j+1];
                    arr[j+1] = temp;
                }
            }
        }

        document.write("<hr/>");
        document.write("Ascending order:" + "<br/>");

        for(i=0;i<n;i++){
            document.write(arr[i] + "<br/>");
        }
    </script>
    
</body>
</html>
