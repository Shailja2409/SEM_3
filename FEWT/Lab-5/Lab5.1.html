<!DOCTYPE html>

<body>
    <!-- 1. Demonstrate the use of array to ƒind maximum number. (A) -->
    <script>
        arr = [23,45,78,88,12,1,5,10]

        max = arr[0];

        for(i=0;i<arr.length;i++){
            if(max < arr[i]){
                max = arr[i];
            }
        }

        document.write("Maximum number is:" +max);
    </script>
    
</body>
