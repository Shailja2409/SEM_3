<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab5.4 (Qiuck Sort)</title>
</head>
<body>
    <!-- 4. WAP to read an array form the user and sort them using quick sort. (B) -->
    <script>

    function quick_sort(arr){
        if(arr.length <= 1){
            return arr;
        }
            
        let pivot = arr[arr.length-1];

        let left = [];
        let right = [];

        for (let i = 0; i < arr.length - 1; i++){
            if (arr[i] < pivot){
                left.push(arr[i]); // Send to the left side
            } 
            else{
                right.push(arr[i]); // Send to the right side
            }
        }

        let mergedArr = []
        let leftSort = quick_sort(left)
        let rightSort = quick_sort(right)

        for(let i = 0; i < leftSort.length; i++){
            mergedArr.push(leftSort[i])
        }
            
        mergedArr.push(pivot)

        for(let i = 0; i < rightSort.length; i++){
            mergedArr.push(rightSort[i])
        }

        return mergedArr

    }

    let array = [23,45,78,88,12,1,5,10]
    document.write("Original Array: ", array, "<br/>");
    document.write("<br/>");

    let sortedResult = quick_sort(array);
    document.write("Sorted Array:   " , sortedResult);

    </script>
    
</body>
</html>
