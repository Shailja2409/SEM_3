<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab4.3.1</title>
</head>
<body>
    <!-- 3.1 WAP to display given patterns using JavaScript. (A) -->
    <!-- Patterns -->

<!-- 1) 1234
        123
        12
        1 -->

    <script>
        n = parseInt(prompt("Enter a number:"));

        for(i=n;i>=1;i--){
            for(j=1;j<=i;j++){
                document.write(j);
            }
            document.write("<br/>");
        }

    </script>

    
</body>
</html>
