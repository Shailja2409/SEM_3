<!DOCTYPE html>

<body>
    <!-- 7. Write an HTML ƒle with JavaScript that ƒnds position of ƒrst occurrence of vowel “a”, last
    occurrence of vowel “a” in a given word and returns the string between them. For example, ajantathen
    script would return ƒrst occurrence of “a”-that is position 1 and last
    occurrence-6 and string between them is “jant”. (B) -->
    <script>
        word = prompt("Enter a word:");
        first = word.indexOf("a");
        last = word.lastIndexOf("a");
        ans = word.substring(first+1,last);

        document.write("First index of a: " +first + "<br/>");
        document.write("Last index of a: " +last + "<br/>");
        document.write("String in between: " +ans);
    </script>
    
</body>
</html>
