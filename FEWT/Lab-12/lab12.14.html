<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab12.14</title>
</head>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
<body>
    <!-- 14. write a jQuery program to set background of an input element to red when in focus and back to
    white when not in focus. (A) -->

    <input id="text"/>

    <script>
        $("input").focusin(()=>{
            $("#text").css("background-color","red")
        })

        $("input").focusout(()=>{
            $("#text").css("background-color","white")
        })
    </script>
    
</body>
</html>
