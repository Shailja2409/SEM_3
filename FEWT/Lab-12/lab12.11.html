<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab12.11</title>
</head>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
<body>
    <!-- 11. write a jQuery program to toggle hide/show element with id ""myEle"" when clicked on a button
    (A). -->

    <h1 id="myEle">this is h1 tag</h1>

    <button id="toggleBtn">Hide/Show</button>

    <script>
        $("#toggleBtn").click(()=>{
            $("#myEle").toggle()
        })
    </script>
    
</body>
</html>
